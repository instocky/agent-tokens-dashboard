<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Dashboard</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #1d2129;
      --ink: #f5f7fb;
      --muted: rgba(216, 223, 236, 0.62);
      --line: rgba(255, 255, 255, 0.05);
      --grid: rgba(148, 163, 184, 0.12);
      --accent: #8b5cf6;
      --accent-2: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI Variable", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(139, 92, 246, 0.16), transparent 26%),
        linear-gradient(180deg, #0e1014 0%, #11141a 100%);
      min-height: 100vh;
      padding: 24px 28px 48px;
    }
    .shell { max-width: 1280px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      margin-bottom: 18px; color: var(--muted);
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em;
    }
    .topbar a { color: inherit; text-decoration: none; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); }
    .topbar a.active { color: var(--ink); border-color: var(--accent); }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 26px 18px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.02) inset;
    }
    .head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
    }
    .title { font-size: 12px; letter-spacing: 0.20em; text-transform: uppercase; color: var(--ink); font-weight: 600; }
    .meta { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    thead th {
      text-align: left; font-weight: 500; font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
      padding: 10px 12px; border-bottom: 1px solid var(--line);
    }
    thead th.r { text-align: right; }
    tbody td {
      padding: 12px; border-bottom: 1px solid var(--line);
      font-size: 13px; color: var(--ink);
    }
    tbody td.r { text-align: right; }
    tbody tr:last-child td { border-bottom: none; }
    .project-name { font-weight: 600; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .pill-active { background: rgba(16, 185, 129, 0.16); color: #10b981; }
    .pill-idle { background: rgba(148, 163, 184, 0.16); color: #94a3b8; }
    .empty { color: var(--muted); }
    .err { padding: 12px 16px; border: 1px solid #ef4444; border-radius: 12px; color: #ef4444; background: rgba(239, 68, 68, 0.08); margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <span>Project Dashboard</span>
      <span id="updated">—</span>
      <span>
        <a href="dashboard.html">Tokens</a>
        <a href="project-dashboard.html" class="active">Projects</a>
        <a href="session-dashboard.html">Sessions</a>
      </span>
    </div>

    <div id="err"></div>

    <div class="card">
      <div class="head">
        <div class="title" id="title">Project Usage</div>
        <div class="meta" id="meta">—</div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Project</th>
            <th class="r">Last update</th>
            <th class="r">Duration</th>
            <th class="r">Tokens</th>
            <th class="r">Cost</th>
            <th class="r">Rate</th>
            <th class="r">Sessions</th>
            <th class="r">Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8021";
    const REFRESH_MS = 5 * 60 * 1000;

    function el(id) { return document.getElementById(id); }
    function setText(id, v) { el(id).textContent = v; }
    function fmtMsk(iso) { return new Date(iso).toLocaleString("ru-RU", { timeZone: "Europe/Moscow" }); }
    function fmtCompact(n) {
      if (n == null) return "—";
      const abs = Math.abs(n);
      if (abs >= 1_000_000) return (n / 1_000_000).toFixed(2) + "M";
      if (abs >= 1_000) return (n / 1_000).toFixed(1) + "K";
      return String(n);
    }
    function fmtCost(usd) { if (usd == null) return "—"; return "$" + usd.toFixed(2); }
    function fmtDuration(ms) {
      if (ms == null) return "—";
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      if (d > 0) return `${d}d ${h}h`;
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    }
    function fmtRate(tokens, durationMs) {
      if (!durationMs || durationMs <= 0) return "—";
      const hours = durationMs / 3_600_000;
      return fmtCompact(tokens / hours) + "/h";
    }
    function fmtInt(n) { return n.toLocaleString("ru-RU"); }

    function renderRow(p) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="project-name">${p.project}</span></td>
        <td class="r">${p.last_update || "—"}</td>
        <td class="r">${fmtDuration(p.duration_ms)}</td>
        <td class="r">${fmtCompact(p.tokens)}</td>
        <td class="r">${fmtCost(p.cost_usd)}</td>
        <td class="r">${fmtRate(p.tokens, p.duration_ms)}</td>
        <td class="r">${p.sessions}</td>
        <td class="r"><span class="pill ${p.is_active ? 'pill-active' : 'pill-idle'}">${p.is_active ? 'active' : 'idle'}</span></td>
      `;
      return tr;
    }

    async function refresh() {
      try {
        const r = await fetch(API + "/api/v1/projects/snapshot");
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();
        el("err").innerHTML = "";

        setText("updated", "Обновлено: " + fmtMsk(data.now_msk));
        setText("meta", data.window.start + " — " + data.window.end);
        document.title = "Project Dashboard — " + fmtMsk(data.now_msk);

        const tbody = el("rows");
        tbody.innerHTML = "";
        if (data.projects.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="empty" style="text-align:center;padding:32px">нет проектов в окне</td></tr>`;
          return;
        }
        for (const p of data.projects) tbody.appendChild(renderRow(p));
      } catch (e) {
        el("err").innerHTML = `<div class="err">fetch failed: ${e.message} — is the service running on ${API}?</div>`;
        setText("updated", "—");
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
